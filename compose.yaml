name: agenteval-platform
x-app: &app
  image: agenteval-platform:local
  build:
    context: .
    target: runtime
    secrets: [proxy_ca]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
services:
  db:
    image: pgvector/pgvector:pg17-bookworm@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: agenteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/compose_env.py first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/compose_env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-agenteval.sh:ro
    command: [postgres, -c, track_io_timing=on]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d agenteval]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    environment:
      AGENTEVAL_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/agenteval
    command: [python, /app/deploy/migrate.py]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8011}:8000"]
    environment:
      AGENTEVAL_DATABASE_URL: postgresql+asyncpg://agenteval_runtime:${APP_DB_PASSWORD}@db:5432/agenteval
      AGENTEVAL_PROVIDER: fake
      AGENTEVAL_QUEUE_CAPACITY: ${AGENTEVAL_QUEUE_CAPACITY:-1000}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import build_opener,ProxyHandler; build_opener(ProxyHandler({})).open('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  worker:
    <<: *app
    environment:
      AGENTEVAL_DATABASE_URL: postgresql+asyncpg://agenteval_runtime:${APP_DB_PASSWORD}@db:5432/agenteval
      AGENTEVAL_PROVIDER: fake
      AGENTEVAL_WORKER_CONCURRENCY: ${AGENTEVAL_WORKER_CONCURRENCY:-4}
    command: [python, -m, agenteval.worker]
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  tests:
    <<: *app
    profiles: [verification]
    image: agenteval-verification:local
    build:
      context: .
      target: verification
      secrets: [proxy_ca]
    environment:
      AGENTEVAL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/agenteval_test
    command: [pytest, -q, -p, no:cacheprovider, --junitxml=/tmp/tests.xml]
    depends_on:
      db: {condition: service_healthy}
  benchmark:
    <<: *app
    profiles: [benchmark]
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      AGENTEVAL_BENCHMARK_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/agenteval_benchmark
    volumes: [./reports:/app/reports]
    command: [python, -m, agenteval.platform_benchmark, --jobs, '1000', --repetitions, '3', --output, reports/platform-benchmark.json]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres-data:
secrets:
  proxy_ca:
    file: ${AGENTEVAL_BUILD_CA:-.local/build-ca.crt}
