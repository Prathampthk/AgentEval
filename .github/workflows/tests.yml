name: Deterministic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: agenteval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenteval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTEVAL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-not-a-deployment-secret@127.0.0.1:5432/agenteval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: bash scripts/install.sh
      - run: .venv/bin/ruff check src tests scripts migrations
      - run: .venv/bin/ruff format --check src tests scripts migrations
      - run: .venv/bin/pytest -q --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests.xml
