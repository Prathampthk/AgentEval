name: Deterministic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: agenteval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenteval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTEVAL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-not-a-deployment-secret@127.0.0.1:5432/agenteval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/install.sh
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: .venv/bin/ruff check src tests scripts migrations
      - run: .venv/bin/ruff format --check src tests scripts migrations
      - run: .venv/bin/pytest -q --junitxml=artifacts/tests.xml
      - run: .venv/bin/python -m agenteval.regression --demo-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
