name: Container deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - run: docker version && docker compose version && docker buildx version
      - run: python scripts/compose_env.py
      - name: Build containers
        run: |
          set -o pipefail
          docker compose --env-file .local/compose.env build api tests 2>&1 | tee "$RUNNER_TEMP/agenteval-build.log"
      - name: Surface build errors
        if: failure()
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "agenteval-build.log"
          if path.exists():
              for line in path.read_text().splitlines()[-15:]:
                  # Never copy URLs (which can contain credentials) into annotations.
                  if "://" not in line:
                      value = line.replace("%", "%25").replace("\r", "%0D")
                      print("::error title=Container build::" + value)
          PYCODE
      - run: docker compose --env-file .local/compose.env up -d --wait api worker
      - run: python scripts/compose_smoke.py
      - run: python scripts/rag_smoke.py --output artifacts/rag-ci-smoke.json
      - run: python scripts/portfolio_demo.py --output artifacts/portfolio-ci-smoke.json
      - run: npm ci --prefix frontend
      - name: Select installed Chrome
        run: |
          browser_path=$(command -v google-chrome)
          "$browser_path" --version
          printf 'AGENTEVAL_E2E_BROWSER=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:e2e --prefix frontend
        env:
          AGENTEVAL_E2E_URL: http://127.0.0.1:8011
      - run: docker compose --env-file .local/compose.env --profile verification run --rm tests
      - run: docker compose --env-file .local/compose.env --profile benchmark run --rm benchmark python -m agenteval.platform_benchmark --jobs 16 --repetitions 1 --workers 1 4 8 16 --output reports/platform-ci-smoke.json
      - name: Rehearse the one-command demo
        run: python scripts/run_demo.py
      - run: python scripts/create_access_token.py
      - name: Verify private single-owner TLS profile
        run: |
          docker compose -p agenteval-private-ci --env-file .local/compose.env --env-file .local/access.env -f compose.yaml -f compose.private.yaml -f compose.server.yaml build proxy
          docker compose -p agenteval-private-ci --env-file .local/compose.env --env-file .local/access.env -f compose.yaml -f compose.private.yaml -f compose.server.yaml up -d --wait api worker proxy
          python scripts/private_server_smoke.py --project agenteval-private-ci --output artifacts/private-server-ci-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-process-smoke
          path: |
            reports/platform-ci-smoke.json
            artifacts/rag-ci-smoke.json
            artifacts/portfolio-ci-smoke.json
            artifacts/private-server-ci-smoke.json
            artifacts/demo-*/report.json
            frontend/test-results/
      - if: always()
        run: docker compose --env-file .local/compose.env down
      - if: always()
        run: docker compose -p agenteval-demo --env-file .local/compose.env -f compose.yaml down
      - if: always()
        run: docker compose -p agenteval-private-ci --env-file .local/compose.env --env-file .local/access.env -f compose.yaml -f compose.private.yaml -f compose.server.yaml down
